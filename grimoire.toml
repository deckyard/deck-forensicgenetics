# Grimoire book configuration for the @deckyard/forensicgenetics documentation.

[book]
title = "@deckyard/forensicgenetics"
description = "Forensic and statistical genetics for Jennifer: STR match probabilities, kinship and paternity likelihood ratios, general-pedigree peeling, and mtDNA / Y-STR lineage markers."
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "grimoire"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
repoUrl = "https://github.com/deckyard/deck-forensicgenetics"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-forensicgenetics/edit/main/docs/{path}"
footer = 'Part of <a href="https://github.com/deckyard">Deckyard</a>, community decks for <a href="https://jennifer-lang.dev/">Jennifer</a>. Rendered with <a href="https://grimoire.jennifer-lang.dev/">Grimoire</a>.'

[highlight]
enabled = true

[search]
enabled = true
bodyChars = 1200

[pdf]
enabled = false
